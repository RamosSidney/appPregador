<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Metadata & iOS Capabilities -->
    <meta name="theme-color" content="#0B0E14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="appPregador 2.0" />
    <meta name="application-name" content="appPregador 2.0" />
    <meta name="description" content="Ecossistema de Mensagens Virais, Bíblia NVI, Esboços Disruptivos e Academia de Liderança para a Geração Z e Alpha." />
    
    <!-- PWA Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <body class="bg-[#0B0E14] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen selection:bg-purple-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] ServiceWorker registrado com sucesso no escopo:', reg.scope))
            .catch(err => console.warn('[PWA] Falha ao registrar ServiceWorker:', err));
        });
      }
    </script>
